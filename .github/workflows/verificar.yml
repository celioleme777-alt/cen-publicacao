name: verificar
on:
  push:
    paths: ["verificar/pedido.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hashes das imagens da fila
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          pip install -q pillow imagehash
          mkdir -p /tmp/d
          for f in fila/*/feed.jpg.enc fila/*/story.jpg.enc; do
            o=/tmp/d/$(echo "$f" | tr '/' '_' | sed 's/.enc$//')
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:META_TOKEN -in "$f" -out "$o" || echo "FALHA $f"
          done
          python3 - <<'PY'
          import os,hashlib,json
          from PIL import Image
          import imagehash
          r={}
          for n in sorted(os.listdir('/tmp/d')):
              p='/tmp/d/'+n
              try:
                  im=Image.open(p); r[n]={'sha':hashlib.sha256(open(p,'rb').read()).hexdigest(),'ph':str(imagehash.phash(im)),'wh':im.size}
              except Exception as e: r[n]={'erro':str(e)}
          json.dump(r,open('verificar/resultado.json','w'),indent=1)
          PY
          git config user.name "publicador-cen"; git config user.email "publicador-cen@users.noreply.github.com"
          git add verificar/resultado.json; git commit -qm "verificacao fila"; git pull -q --rebase; git push -q

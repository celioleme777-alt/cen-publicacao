name: publicar
on:
  schedule:
    - cron: "3-59/10 * * * *"
  push:
    paths: ["fila/**"]
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publicar itens vencidos
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          git config user.name "publicador-cen"
          git config user.email "publicador-cen@users.noreply.github.com"
          python3 scripts/rotina.py || true
          git pull -q --rebase || true
          git add status/espelho.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "espelho FB" && git push -q)

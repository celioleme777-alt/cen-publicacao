name: publicar
on:
  schedule:
    - cron: "3-59/10 * * * *"
  push:
    paths: ["fila/**"]
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publicar itens vencidos
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          git config user.name "publicador-cen"
          git config user.email "publicador-cen@users.noreply.github.com"
          # itens novos podem chegar sem cifragem (feed.jpg, story.jpg, video.mp4, capa.jpg, story_p*.mp4):
          # cifra aqui com o mesmo segredo e segue o fluxo normal
          for f in fila/*/feed.jpg fila/*/story.jpg fila/*/capa.jpg fila/*/video.mp4 fila/*/story.mp4 fila/*/story_p*.mp4; do
            [ -f "$f" ] || continue
            [ -f "$f.enc" ] || openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:META_TOKEN -in "$f" -out "$f.enc"
          done
          python3 scripts/rotina.py || true
          git pull -q --rebase || true
          git add status/espelho.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "espelho FB" && git push -q)
